<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기상·발전량 LSTM 예측 시스템 흐름도</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:32px 16px;font-family:'Segoe UI',sans-serif}
h1{color:#f1f5f9;font-size:20px;font-weight:500;margin-bottom:6px;text-align:center}
p{color:#64748b;font-size:13px;margin-bottom:28px;text-align:center}
svg{max-width:760px;width:100%}

@keyframes dash-flow {
  from{stroke-dashoffset:40}
  to{stroke-dashoffset:0}
}
@keyframes glow-border {
  0%,100%{stroke-width:1;stroke-opacity:0.7}
  50%{stroke-width:2.5;stroke-opacity:1}
}
@keyframes dot-travel {
  0%  {offset-distance:0%;opacity:0}
  8%  {opacity:1}
  92% {opacity:1}
  100%{offset-distance:100%;opacity:0}
}

.flow-arrow{stroke-dasharray:8 5;animation:dash-flow 1.4s linear infinite;fill:none}
.d1{animation-delay:0s}
.d2{animation-delay:0.28s}
.d3{animation-delay:0.56s}
.d4{animation-delay:0.84s}
.d5{animation-delay:1.12s}
.d6{animation-delay:1.4s}

.bp rect{animation:glow-border 2.2s ease-in-out infinite}
.bp.b1 rect{animation-delay:0s}
.bp.b2 rect{animation-delay:0.35s}
.bp.b3 rect{animation-delay:0.7s}
.bp.b4 rect{animation-delay:1.05s}
.bp.b5 rect{animation-delay:1.4s}
.bp.b6 rect{animation-delay:1.75s}
.bp.b7 rect{animation-delay:2.1s}
.bp.b8 rect{animation-delay:2.45s}
.bp.b9 rect{animation-delay:2.8s}

.dot{r:5;animation:dot-travel 1.8s ease-in-out infinite}
.dot.d1{animation-delay:0s}
.dot.d2{animation-delay:0.35s}
.dot.d3{animation-delay:0.7s}
.dot.d4{animation-delay:1.05s}
.dot.d5{animation-delay:1.4s}
.dot.d6{animation-delay:1.75s}

.lm{font-size:13px;font-weight:600;fill:#f1f5f9}
.ls{font-size:11px;fill:#94a3b8}
.sl{font-size:11px;fill:#475569;font-style:italic}
</style>
</head>
<body>
<h1>기상 · 발전량 LSTM 예측 시스템</h1>
<p>외부 데이터 수집 → DB 저장 → 학습 → 발전량 예측</p>

<svg viewBox="0 0 720 660" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── SECTION 1: 기상 수집 ── -->
<text class="sl" x="30" y="22">① 기상 데이터 수집 경로</text>

<!-- 블록1: 기상 API -->
<g class="bp b1">
  <rect x="20" y="30" width="170" height="64" rx="8" fill="#0a2820" stroke="#1D9E75"/>
  <text class="lm" x="105" y="52" text-anchor="middle">인터넷 기상 서버</text>
  <text class="ls" x="105" y="68" text-anchor="middle">시간별 기온·습도·</text>
  <text class="ls" x="105" y="82" text-anchor="middle">풍속·일사량 제공</text>
</g>

<line class="flow-arrow d1" x1="190" y1="62" x2="248" y2="62" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/>
<circle class="dot d1" fill="#1D9E75" style="offset-path:path('M190 62 L248 62')"/>

<!-- 블록2: 수집 스크립트 -->
<g class="bp b2">
  <rect x="250" y="30" width="170" height="64" rx="8" fill="#0a2820" stroke="#1D9E75"/>
  <text class="lm" x="335" y="52" text-anchor="middle">30일치 기상 수집</text>
  <text class="ls" x="335" y="68" text-anchor="middle">API 호출 후</text>
  <text class="ls" x="335" y="82" text-anchor="middle">720시간 데이터 정리</text>
</g>

<line class="flow-arrow d2" x1="420" y1="62" x2="478" y2="62" stroke="#1D9E75" stroke-width="2" marker-end="url(#at)"/>
<circle class="dot d2" fill="#1D9E75" style="offset-path:path('M420 62 L478 62')"/>

<!-- 블록3: DB 기상 -->
<g class="bp b3">
  <rect x="480" y="30" width="210" height="64" rx="8" fill="#0b1e33" stroke="#378ADD"/>
  <text class="lm" x="585" y="52" text-anchor="middle">데이터베이스 저장</text>
  <text class="ls" x="585" y="68" text-anchor="middle">기상 테이블</text>
  <text class="ls" x="585" y="82" text-anchor="middle">720행 (30일×24시간)</text>
</g>

<!-- ── SECTION 2: Modbus 수집 ── -->
<text class="sl" x="30" y="152">② 현장 발전량 측정 경로</text>

<!-- 블록4: RP2040 -->
<g class="bp b4">
  <rect x="20" y="160" width="170" height="64" rx="8" fill="#2a0e08" stroke="#D85A30"/>
  <text class="lm" x="105" y="182" text-anchor="middle">현장 측정 장치</text>
  <text class="ls" x="105" y="198" text-anchor="middle">Arduino가 발전량·</text>
  <text class="ls" x="105" y="212" text-anchor="middle">온도·습도 측정</text>
</g>

<line class="flow-arrow d3" x1="190" y1="192" x2="248" y2="192" stroke="#D85A30" stroke-width="2" marker-end="url(#ac)"/>
<circle class="dot d3" fill="#D85A30" style="offset-path:path('M190 192 L248 192')"/>

<!-- 블록5: Modbus 수집 -->
<g class="bp b5">
  <rect x="250" y="160" width="170" height="64" rx="8" fill="#2a0e08" stroke="#D85A30"/>
  <text class="lm" x="335" y="182" text-anchor="middle">실시간 데이터 수신</text>
  <text class="ls" x="335" y="198" text-anchor="middle">USB 시리얼 통신으로</text>
  <text class="ls" x="335" y="212" text-anchor="middle">1초마다 값 읽기</text>
</g>

<line class="flow-arrow d4" x1="420" y1="192" x2="478" y2="192" stroke="#D85A30" stroke-width="2" marker-end="url(#ac)"/>
<circle class="dot d4" fill="#D85A30" style="offset-path:path('M420 192 L478 192')"/>

<!-- 블록6: DB 발전량 -->
<g class="bp b6">
  <rect x="480" y="160" width="210" height="64" rx="8" fill="#0b1e33" stroke="#378ADD"/>
  <text class="lm" x="585" y="180" text-anchor="middle">데이터베이스 저장</text>
  <text class="ls" x="585" y="196" text-anchor="middle">발전량 테이블 → </text>
  <text class="ls" x="585" y="212" text-anchor="middle">시간 단위로 자동 집계</text>
</g>

<!-- DB 발전량 → 집계 VIEW 아래 화살표 -->
<line class="flow-arrow d5" x1="585" y1="224" x2="585" y2="272" stroke="#378ADD" stroke-width="2" marker-end="url(#ab)"/>
<circle class="dot d5" fill="#378ADD" style="offset-path:path('M585 224 L585 272')"/>

<!-- ── SECTION 3: JOIN ── -->
<text class="sl" x="30" y="288">③ 기상 + 발전량 합치기</text>

<!-- 블록7: VIEW -->
<g class="bp b6">
  <rect x="480" y="274" width="210" height="64" rx="8" fill="#0b1e33" stroke="#378ADD"/>
  <text class="lm" x="585" y="295" text-anchor="middle">시간별 발전량 평균</text>
  <text class="ls" x="585" y="311" text-anchor="middle">분 단위 데이터를</text>
  <text class="ls" x="585" y="325" text-anchor="middle">1시간 단위로 묶기</text>
</g>

<line class="flow-arrow d6" x1="480" y1="306" x2="422" y2="306" stroke="#378ADD" stroke-width="2" marker-end="url(#ab)"/>
<circle class="dot d6" fill="#378ADD" style="offset-path:path('M480 306 L422 306')"/>

<!-- 블록8: JOIN -->
<g class="bp b7">
  <rect x="250" y="274" width="170" height="64" rx="8" fill="#1a1a22" stroke="#64748b"/>
  <text class="lm" x="335" y="295" text-anchor="middle">기상 + 발전량 결합</text>
  <text class="ls" x="335" y="311" text-anchor="middle">같은 시각 기준으로</text>
  <text class="ls" x="335" y="325" text-anchor="middle">두 데이터 합치기 (696행)</text>
</g>

<line class="flow-arrow d1" x1="335" y1="338" x2="335" y2="386" stroke="#64748b" stroke-width="2" marker-end="url(#ag)"/>
<circle class="dot d1" fill="#64748b" style="offset-path:path('M335 338 L335 386')"/>

<!-- ── SECTION 4: ML ── -->
<text class="sl" x="30" y="403">④ 데이터 전처리 및 학습</text>

<!-- 블록9: ml_shared -->
<g class="bp b7">
  <rect x="250" y="390" width="170" height="64" rx="8" fill="#0d1f08" stroke="#639922"/>
  <text class="lm" x="335" y="411" text-anchor="middle">학습 데이터 준비</text>
  <text class="ls" x="335" y="427" text-anchor="middle">결측치 보정 후</text>
  <text class="ls" x="335" y="441" text-anchor="middle">35시간 묶음으로 변환</text>
</g>

<line class="flow-arrow d2" x1="250" y1="422" x2="192" y2="422" stroke="#639922" stroke-width="2" marker-end="url(#ag)"/>
<circle class="dot d2" fill="#639922" style="offset-path:path('M250 422 L192 422')"/>

<line class="flow-arrow d3" x1="420" y1="422" x2="478" y2="422" stroke="#639922" stroke-width="2" marker-end="url(#ag)"/>
<circle class="dot d3" fill="#639922" style="offset-path:path('M420 422 L478 422')"/>

<!-- 블록10: Baseline -->
<g class="bp b8">
  <rect x="20" y="390" width="170" height="64" rx="8" fill="#1a1630" stroke="#7F77DD"/>
  <text class="lm" x="105" y="411" text-anchor="middle">빠른 예측 모델</text>
  <text class="ls" x="105" y="427" text-anchor="middle">현재 상태 8가지로</text>
  <text class="ls" x="105" y="441" text-anchor="middle">1시간 뒤 예측</text>
</g>

<!-- 블록11: LSTM -->
<g class="bp b9">
  <rect x="480" y="390" width="210" height="64" rx="8" fill="#1a1630" stroke="#7F77DD"/>
  <text class="lm" x="585" y="411" text-anchor="middle">LSTM 딥러닝 모델</text>
  <text class="ls" x="585" y="427" text-anchor="middle">과거 35시간 패턴을</text>
  <text class="ls" x="585" y="441" text-anchor="middle">학습해 발전량 예측</text>
</g>

<line class="flow-arrow d4" x1="105" y1="454" x2="105" y2="502" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/>
<circle class="dot d4" fill="#7F77DD" style="offset-path:path('M105 454 L105 502')"/>

<line class="flow-arrow d5" x1="585" y1="454" x2="585" y2="502" stroke="#7F77DD" stroke-width="2" marker-end="url(#ap)"/>
<circle class="dot d5" fill="#7F77DD" style="offset-path:path('M585 454 L585 502')"/>

<!-- ── SECTION 5: 결과 ── -->
<text class="sl" x="30" y="520">⑤ 예측 결과 비교</text>

<!-- 블록12: Baseline 결과 -->
<g class="bp b8">
  <rect x="20" y="508" width="170" height="80" rx="8" fill="#1e1a06" stroke="#EF9F27"/>
  <text class="lm" x="105" y="530" text-anchor="middle">빠른 모델 성능</text>
  <text class="ls" x="105" y="548" text-anchor="middle">오차 0.13 kW 수준</text>
  <text class="ls" x="105" y="564" text-anchor="middle">정확도 98.7%</text>
  <text class="ls" x="105" y="578" text-anchor="middle">(더미 데이터 기준)</text>
</g>

<!-- 블록13: LSTM 결과 -->
<g class="bp b9">
  <rect x="480" y="508" width="210" height="80" rx="8" fill="#1e1a06" stroke="#EF9F27"/>
  <text class="lm" x="585" y="530" text-anchor="middle">LSTM 모델 성능</text>
  <text class="ls" x="585" y="548" text-anchor="middle">오차 0.24 kW 수준</text>
  <text class="ls" x="585" y="564" text-anchor="middle">실제 데이터 누적 시</text>
  <text class="ls" x="585" y="578" text-anchor="middle">성능 향상 기대</text>
</g>

<!-- 범례 -->
<rect x="20" y="610" width="670" height="42" rx="8" fill="#111827" stroke="#1e293b" stroke-width="0.5"/>
<line x1="40" y1="631" x2="68" y2="631" stroke="#1D9E75" stroke-width="2" stroke-dasharray="6 3"/>
<text style="font-size:11px;fill:#94a3b8" x="74" y="635">기상 흐름</text>
<line x1="160" y1="631" x2="188" y2="631" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 3"/>
<text style="font-size:11px;fill:#94a3b8" x="194" y="635">발전량 흐름</text>
<line x1="300" y1="631" x2="328" y2="631" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 3"/>
<text style="font-size:11px;fill:#94a3b8" x="334" y="635">DB 집계 흐름</text>
<line x1="440" y1="631" x2="468" y2="631" stroke="#7F77DD" stroke-width="2" stroke-dasharray="6 3"/>
<text style="font-size:11px;fill:#94a3b8" x="474" y="635">ML 예측 흐름</text>
<text style="font-size:11px;fill:#475569" x="580" y="635">● 점 = 데이터 이동</text>
</svg>
</body>
</html>
